{% if messages %}
<div class="mb-3">
  {% for m in messages %}
  <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show d-flex align-items-start gap-2 shadow-sm" role="alert">
    <i class="bi {% if m.tags == 'success' %}bi-check-circle-fill{% elif m.tags == 'danger' %}bi-exclamation-octagon-fill{% elif m.tags == 'warning' %}bi-exclamation-triangle-fill{% else %}bi-info-circle-fill{% endif %} mt-1"></i>
    <div>{{ m }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Yopish"></button>
  </div>
  {% endfor %}
</div>
{% endif %}
